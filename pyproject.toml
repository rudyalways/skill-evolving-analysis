[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-evolving-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.174",
    "jsonschema==4.26.0",
]

# This repository is an application workspace, not an importable Python
# distribution.  Disable setuptools' flat-layout auto-discovery so `uv run`
# does not mistake data, demos, and skill directories for top-level packages.
[tool.setuptools]
py-modules = []

[tool.unittest]
start-directory = "skill_evolving_agents/tests"

[tool.ruff]
target-version = "py311"
line-length = 100
